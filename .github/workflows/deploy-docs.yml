# Publishing the documentation site to GitHub Pages.
#
# The path filter here works and is needed: the docs live in the same
# repository as the app, and there is no reason to redeploy the site on every
# Rust commit. The release workflow has no filter and cannot have one — it is
# triggered by a tag.
#
# The second trigger is workflow_call: the release workflow calls this one at
# the end, because the "Download" button is assembled while the site is built.
# Without that call it would lag behind a fresh release until the next docs
# edit.

name: Publish documentation

on:
  push:
    branches: [master]
    paths:
      - 'apps/docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time. We will not cancel one already running: a
# half-built site is better not published at all, and the next run catches up
# anyway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # The version is pinned to a number rather than the `lts/*` alias: the
      # alias moves to the next LTS line on its own, without a commit, and
      # breaks the build on a day when nobody changed anything. The lower bound
      # is set by pnpm — it requires Node 22.13 or newer, otherwise it fails on
      # `node:sqlite`.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Building the site does not depend on the Rust side and must not: the
      # docs have to be publishable even while the app temporarily does not
      # compile.
      - run: pnpm build:docs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
