[package]
name = "cpo-desktop"
version = "0.1.0"
description = "Управление портабл-сборками ComfyUI"
authors = ["Andrew Blokhin"]
edition = "2021"

[lib]
# Суффикс _lib нужен, чтобы имя библиотеки не конфликтовало с именем
# бинаря — на Windows иначе ломается сборка.
name = "cpo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Фича unstable обязательна: мультивебвью, на котором держится вся идея
# встроенных вкладок, пока доступен только за ней.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
specta = "2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-plugin-store = "2.4.4"
tauri-plugin-os = "2.3.2"
dunce = "1.0.5"
tauri-plugin-dialog = "2.7.2"
