[package]
name = "cpo-desktop"
version = "0.1.0"
description = "Управление портабл-сборками ComfyUI"
authors = ["Andrew Blokhin"]
edition = "2021"

[lib]
# Суффикс _lib нужен, чтобы имя библиотеки не конфликтовало с именем
# бинаря — на Windows иначе ломается сборка.
name = "cpo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Фича unstable обязательна: мультивебвью, на котором держится вся идея
# встроенных вкладок, пока доступен только за ней.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
specta = "2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-plugin-store = "2.4.4"
tauri-plugin-os = "2.3.2"
dunce = "1.0.5"
tauri-plugin-dialog = "2.7.2"
sevenz-rust2 = "0.21.4"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

# Зависимости в дев-сборке собираются как в релизе, наш код остаётся
# отлаживаемым. Обе строки обязательны, и каждая закрывает свою беду.
#
# opt-level: без него LZMA2 и BCJ2 декодируют в двадцать раз медленнее
# (20 файлов в секунду против 404), и мастер выглядит намертво зависшим.
#
# debug-assertions: фильтр BCJ2 складывает 32-битные адреса с намеренным
# переполнением — для него это штатная арифметика. С включёнными проверками
# lzma-rust2 паникует «attempt to add with overflow» на середине распаковки
# (decode.rs:149). В релизе проверок нет, поэтому там всё работает, и под
# релизом библиотека и тестируется.
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false
