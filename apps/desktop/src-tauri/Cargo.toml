[package]
name = "cpo-desktop"
version = "0.1.0"
description = "Управление портабл-сборками ComfyUI"
authors = ["Andrew Blokhin"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Quo0/ComfyUI-portable-organizer"
homepage = "https://github.com/Quo0/ComfyUI-portable-organizer"

[lib]
# Суффикс _lib нужен, чтобы имя библиотеки не конфликтовало с именем
# бинаря — на Windows иначе ломается сборка.
name = "cpo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Инспектор WebView2. Отдельной фичей, а не по debug_assertions: профиль
# в конце файла гасит их у всех зависимостей, и штатный путь devtools
# внутри tauri и wry вырезается препроцессором. Подставляется скриптом
# `pnpm dev:desktop`; в релизной сборке фичи нет.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Фича unstable обязательна: мультивебвью, на котором держится вся идея
# встроенных вкладок, пока доступен только за ней.
# tray-icon — чтобы приложение можно было свернуть, оставив серверы жить.
tauri = { version = "2", features = ["unstable", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# Второй экземпляр приложения — это второй Job Object и второй реестр
# в одном файле. Плагин вместо запуска показывает уже открытое окно.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
specta = "2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-plugin-store = "2.4.4"
# Обновление приложения. Подпись манифеста плагин проверяет сам по ключу
# из `plugins.updater.pubkey` — не сошлась, установка не начинается.
tauri-plugin-updater = "2"
tauri-plugin-os = "2.3.2"
dunce = "1.0.5"
tauri-plugin-dialog = "2.7.2"
sevenz-rust2 = "0.21.4"
# HTTP к работающему ComfyUI. Без TLS: ходим только на 127.0.0.1, шифровать
# нечего, а с ним крейт тянул бы rustls со всей его роднёй. Синхронный —
# ложится на правило «логика в обычных функциях, команды — тонкие обёртки».
ureq = { version = "3.4.0", default-features = false }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

# Зависимости в дев-сборке собираются как в релизе, наш код остаётся
# отлаживаемым. Обе строки обязательны, и каждая закрывает свою беду.
#
# opt-level: без него LZMA2 и BCJ2 декодируют в двадцать раз медленнее
# (20 файлов в секунду против 404), и мастер выглядит намертво зависшим.
#
# debug-assertions: фильтр BCJ2 складывает 32-битные адреса с намеренным
# переполнением — для него это штатная арифметика. С включёнными проверками
# lzma-rust2 паникует «attempt to add with overflow» на середине распаковки
# (decode.rs:149). В релизе проверок нет, поэтому там всё работает, и под
# релизом библиотека и тестируется.
#
# Побочный эффект, за который заплачено: `"*"` — это и сами tauri, wry
# и tauri-runtime-wry. Выключенные debug-assertions гасят в них
# `cfg(debug_assertions)`, а весь путь devtools спрятан именно за ним:
# `with_devtools()` вырезается, WebView2 получает `AreDevToolsEnabled = false`,
# и инспектор молчит на F12, на Ctrl+Shift+I и на «Inspect» из меню. Поэтому
# в дев-сборке он включается фичей `devtools`, а не сам собой.
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false
